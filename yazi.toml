[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 1200
max_height      = 1500
image_filter    = "triangle"
image_quality   = 75

[opener]
edit = [
	{ run = '${EDITOR:-nvim} %s', block = true, desc = "Edit in Neovim" },
]
glow = [
	{ run = 'glow -p %s', block = true, desc = "Read Markdown with Glow" },
]
pdf = [
	{ run = 'bash ~/.config/tmux/scripts/view_pdf.sh %s', block = true, desc = "View PDF page-by-page" },
]
image = [
	{ run = 'kitty +kitten icat --stdin no --hold %s', block = true, desc = "View image full-screen" },
]
open = [
	{ run = 'open %s', desc = "Open in default system app" },
]

[open]
prepend_rules = [
	{ url = "*.md", use = [ "glow", "edit", "open" ] },
	{ url = "*.markdown", use = [ "glow", "edit", "open" ] },
	{ mime = "application/pdf", use = [ "pdf", "open" ] },
	{ mime = "image/*", use = [ "image", "open" ] },
	{ mime = "video/*", use = [ "open" ] },
	{ mime = "audio/*", use = [ "open" ] },
	{ mime = "text/*", use = [ "edit", "open" ] },
	{ mime = "application/json", use = [ "edit", "open" ] },
	{ mime = "application/javascript", use = [ "edit", "open" ] },
	{ mime = "application/xml", use = [ "edit", "open" ] },
	{ mime = "application/toml", use = [ "edit", "open" ] },
	{ mime = "application/x-yaml", use = [ "edit", "open" ] },
	{ mime = "application/x-sh", use = [ "edit", "open" ] },
]
append_rules = [
	{ url = "*", use = [ "edit", "open" ] },
]
